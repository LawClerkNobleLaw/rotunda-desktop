# Builds the Mac, Windows and Linux installers on GitHub's own machines.
#
# - Run by hand (Actions tab → "Build" → Run workflow): builds all three and
#   keeps them on the run's page to try — nothing is published.
# - Push a version tag (git tag v1.0.1 && git push origin v1.0.1): builds all
#   three and publishes them as that release. The website's Download buttons
#   point at releases/latest/download/<name>, so the file names below are fixed
#   and must not change.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Read-only unless a job asks for more (only "release" does, to publish).
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - os: windows-latest
            args: --bundles nsis
          - os: ubuntu-22.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to exact commits, so a moved tag can't change the build.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Installs exactly what package-lock.json lists.
      - run: npm ci

      - name: Icons from app-icon.svg
        run: npx tauri icon app-icon.svg

      # Until the Apple Developer secrets are added, the Mac app is built
      # without Apple's stamp (people see "Open Anyway" once). The secrets are
      # given to this step only, and only on the Mac. An empty secret still
      # counts as "set" to the bundler, so empty ones are removed first.
      # --locked: build exactly what Cargo.lock lists, or stop.
      - name: Build
        env:
          APPLE_CERTIFICATE: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npx tauri build ${{ matrix.args }} -- --locked

      - name: Give the installers their fixed names
        run: |
          mkdir out
          find src-tauri/target -path '*/bundle/*' -type f \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' \) | while read -r f; do
            case "$f" in
              *.dmg) cp "$f" out/Rotunda-mac.dmg ;;
              *-setup.exe) cp "$f" out/Rotunda-windows-setup.exe ;;
              *.AppImage) cp "$f" out/Rotunda-linux.AppImage ;;
              *.deb) cp "$f" out/Rotunda-linux.deb ;;
            esac
          done
          ls -la out
          [ -n "$(ls out)" ]

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rotunda $GITHUB_REF_NAME" \
            --notes "Download Rotunda for your computer: Rotunda-mac.dmg (Mac), Rotunda-windows-setup.exe (Windows), Rotunda-linux.AppImage or Rotunda-linux.deb (Linux)."
